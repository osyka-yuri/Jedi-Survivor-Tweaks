; ==============================================================================
; Jedi Survivor Tweaks Configuration
; ==============================================================================
; Place this file beside the active ASI plugin or ReShade add-on.
; Lines starting with ";" are comments and are ignored.
;
; Booleans: true / false. Decimals use a dot, for example 1.0.
; Guide: github.com/osyka-yuri/Jedi-Survivor-Tweaks/tree/main/docs/user

; ==============================================================================
; UI & DISPLAY
; ==============================================================================

[AspectRatioUIFix]
; Corrects oversized HUD and menus on 16:10 displays.
; Use 0.9 for the correction; 1.0 leaves the original scale unchanged.
;   Default = 0.9
;   Range   = 0.5 – 1.5
Enabled = false
Multiplier = 0.9

[LetterboxPillarboxFix]
; Removes forced black bars in supported cutscenes.
Enabled = true


; ==============================================================================
; GAMEPLAY
; ==============================================================================

[GameplayFOV]
; Multiplier for the gameplay field of view.
;   Default = 1.0 (no change)
;   Range   = 0.0 – 10.0
Enabled = false
Multiplier = 1.0

[CameraDistance]
; Multiplier for the gameplay camera distance.
;   Default = 1.0 (no change)
;   Range   = 0.0 – 10.0
Enabled = false
Multiplier = 1.0


; ==============================================================================
; GRAPHICS
; ==============================================================================

[GraphicalTweaks]
; Startup switch for the graphical tweaks below. If disabled, startup leaves
; all three game values untouched.
Enabled = true

[Sharpening]
; Controls image sharpening.
; CVar: r.Tonemapper.Sharpen
;   Default = 1.0
;   Range   = 0.0 – 10.0
;   Set to 0.0 to fully disable sharpening.
Enabled = true
Strength = 1.0

[ChromaticAberration]
; Set false to remove chromatic aberration (shipped default).
; CVar: r.SceneColorFringeQuality
Enabled = false

[Vignette]
; Set false to remove vignette.
; CVar: r.Tonemapper.Quality
Enabled = true


; ==============================================================================
; PERFORMANCE
; ==============================================================================

[InterpolatedRendering]
; Opt-in frame interpolation intended to reduce CPU stutter and camera jitter.
; CVar: respawn.InterpolatedRendering
Enabled = false

[StreamingPoolFix]
; Stabilizes the streaming pool to help prevent runaway VRAM use.
; CVar: r.Streaming.PoolSize
;
; PoolSizeGB:
;   auto — detect and freeze a safe size (recommended)
;   2.0  — request a manual size in GiB
; Manual and automatic values are capped for the active GPU when detected.
;
;   Default = auto
Enabled = true
PoolSizeGB = auto


[MaxFPS]
; Sets the frame-rate limit. Disabled at startup leaves the game limit alone.
; CVar: t.MaxFPS
; TargetFPS: 0 – 300 (0 = uncapped)
;   Default = 60
; Live disable sets t.MaxFPS to 0 (uncapped).
Enabled = false
TargetFPS = 60


[CVars]
; Custom Unreal Engine Console Variable (CVar) overrides.
; Format:  CVarName = Value
; Types:   float (e.g. 1.0), integer (e.g. 0), or boolean (true/false)
; Specialized enabled controls win conflicts; unrelated custom CVars still apply.
;
; Examples (remove the leading ";" to activate):
; r.VSync = 0
; r.D3D12.UseAllowTearing = 1
