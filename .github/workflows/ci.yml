name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install documentation dependencies
        run: npm ci

      - name: Check documentation
        run: npm run docs:check

  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release
          - ReleaseAddon

    steps:
      - uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build ${{ matrix.configuration }}|x64
        run: >-
          msbuild JediSurvivorTweaks.sln
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /t:Rebuild

      - name: Run ${{ matrix.configuration }} tests
        shell: pwsh
        run: |
          & ".\x64\${{ matrix.configuration }}\tests\JediSurvivorTweaks.Tests.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "${{ matrix.configuration }} tests failed with exit code $LASTEXITCODE."
          }
